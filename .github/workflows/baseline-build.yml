---
name: Baseline Build Check

on:
  push:
    branches: [main]
    paths:
      - "scripts/src/**"
      - "scripts/build.sh"
      - "scripts/run-hardening.sh"
      - "ansible-hardening/playbooks/**"
      - "ansible-hardening/roles/*/defaults/**"
      - "scripts/cyberaar-baseline.sh"
      - ".github/workflows/baseline-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/src/**"
      - "scripts/build.sh"
      - "scripts/run-hardening.sh"
      - "ansible-hardening/playbooks/**"
      - "ansible-hardening/roles/*/defaults/**"
      - "scripts/cyberaar-baseline.sh"
      - ".github/workflows/baseline-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: baseline-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run build.sh
        run: bash scripts/build.sh

      - name: Verify bundle is in sync with src/
        run: |
          if ! git diff --exit-code scripts/cyberaar-baseline.sh; then
            echo ""
            echo "ERROR: cyberaar-baseline.sh is out of sync with src/."
            echo "Run 'bash scripts/build.sh' locally and commit the result."
            exit 1
          fi

      - name: Verify check count
        run: |
          COUNT=$(grep -oh '"[A-Z]\{2,4\}-[0-9]\{2\}"' scripts/cyberaar-baseline.sh | sort -u | wc -l)
          echo "Unique check IDs in bundle: $COUNT"
          if [[ "$COUNT" -lt 90 ]]; then
            echo "ERROR: Fewer than 90 unique checks found — build may be corrupt."
            exit 1
          fi
          echo "Check count OK: $COUNT"

      - name: Verify bash syntax
        run: bash -n scripts/cyberaar-baseline.sh

      # Coverage we cannot get any other way: CI runs on Ubuntu and Molecule
      # tests Rocky 9 and Ubuntu 22.04, so nothing in the pipeline ever executes
      # on openSUSE, Alpine, Arch or Amazon Linux. These feed the mapping their
      # real /etc/os-release and assert the answer.
      # Neither the baseline nor run-hardening.sh was linted. That is how a typo
      # split ${RING_COLORALPHA} into ${RING_COLOR}ALPHA and shipped invalid CSS
      # into every HTML report, silently, because browsers drop a bad filter
      # without complaining. shellcheck reported it as an unused variable.
      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/cyberaar-baseline.sh
          shellcheck -S warning scripts/run-hardening.sh

      - name: Distribution mapping tests
        run: bash scripts/tests/test_distro.sh

      # The plan printed at the end of every audit is built from ANSIBLE_MAP.
      # Nothing verified those tags and roles existed, so a typo produced a
      # command that runs cleanly, matches nothing and changes nothing, while
      # the operator believes the finding is remediated.
      - name: Remediation map points at real tags and roles
        run: bash scripts/tests/test_remediation_map.sh

      # The audit script was at 4.2.0 while every JSON report it wrote claimed
      # 4.0.0, because the renderer had the number typed in as a literal.
      # Numbers that must agree, agree here or the build fails.
      - name: Versions agree across sources, bundles, reports and the image tag
        run: bash scripts/tests/test_versions.sh

      - name: Escaping regression tests
        run: bash scripts/tests/test_escaping.sh
