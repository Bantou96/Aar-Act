---
name: EE Build & Push

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build image but do not push to ghcr.io"
        required: false
        default: "false"

jobs:
  build:
    name: ee-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read collection version from galaxy.yml
        id: meta
        run: |
          VERSION=$(grep '^version:' ansible-hardening/galaxy.yml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: execution-environment/Containerfile
          build-args: |
            COLLECTION_VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event.inputs.dry_run != 'true' }}
          # The image is named after the product now. ee-hardening is still
          # pushed so anything already pulling that name keeps working.
          tags: |
            ghcr.io/cyberaar/aartool:latest
            ghcr.io/cyberaar/aartool:v${{ steps.meta.outputs.version }}
            ghcr.io/cyberaar/ee-hardening:latest
            ghcr.io/cyberaar/ee-hardening:v${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry run: image built but not pushed."
          echo "  ghcr.io/cyberaar/aartool:v${{ steps.meta.outputs.version }}"
          echo "  ghcr.io/cyberaar/aartool:latest"
          echo "  ghcr.io/cyberaar/ee-hardening:v${{ steps.meta.outputs.version }} (compatibility)"
          echo "  ghcr.io/cyberaar/ee-hardening:latest (compatibility)"
